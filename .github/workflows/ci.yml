name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (Python 3.12 · SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mapdal
          POSTGRES_PASSWORD: mapdal
          POSTGRES_DB: mapdal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mapdal" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      MAPDAL_TEST_POSTGRES_URL: postgresql://mapdal:mapdal@localhost:5432/mapdal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Compile all modules
        run: python -m compileall -q *.py scripts
      - name: pytest
        run: python -m pytest -q tests

  browser:
    name: node --test (Playwright · Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1
      - name: node --test
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node --test tests/*.test.cjs
